<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>射法八節 3D 檢視</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --line: #2c3038; --text: #e8e6e1; --muted: #9a9890;
    --accent: #d9a441; --left: #4fa3e0; --right: #e0614f; --core: #e8e6e1;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Noto Sans TC", sans-serif; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header small { color: var(--muted); }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .stage { position: relative; background: #000; border-radius: 8px; overflow: hidden; height: min(62vh, 640px); }
  .stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #three { background: radial-gradient(#f4f5f7, #d5d8de); }
  .tag { position: absolute; top: 8px; left: 8px; background: #000a; padding: 2px 8px; border-radius: 4px; font-size: 12px; z-index: 2; }
  #phase { position: absolute; top: 8px; right: 8px; background: var(--accent); color: #111; font-weight: 700; padding: 4px 12px; border-radius: 4px; font-size: 18px; z-index: 2; }
  .controls { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button.on { border-color: var(--accent); color: var(--accent); }
  #timeline { grid-column: 1 / -1; position: relative; height: 44px; background: var(--panel); border-radius: 6px; cursor: pointer; overflow: hidden; }
  #timeline .seg { position: absolute; top: 0; bottom: 0; border-right: 1px solid var(--bg); display: flex; align-items: center; justify-content: center; font-size: 12px; color: #111; overflow: hidden; white-space: nowrap; }
  #timeline .cursor { z-index: 1; position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; pointer-events: none; }
  #timeline .release { z-index: 1; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--right); pointer-events: none; }
  .metrics { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .metric { background: var(--panel); border-radius: 6px; padding: 8px 10px; }
  .metric b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .metric span { color: var(--muted); font-size: 12px; }
  .metric em { display: block; font-style: normal; color: var(--accent); font-size: 13px; min-height: 1.2em; }
  .note { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>射法八節 3D 檢視</h1>
  <small id="source"></small>
</header>
<main>
  <div class="stage">
    <span class="tag">影片</span>
    <span id="phase">—</span>
    <video id="video" playsinline muted preload="auto"></video>
  </div>
  <div class="stage">
    <span class="tag">3D 人形（可拖曳旋轉）</span>
    <canvas id="three"></canvas>
  </div>
  <div class="controls">
    <button id="play">▶ 播放</button>
    <button data-rate="0.25">0.25×</button>
    <button data-rate="0.5">0.5×</button>
    <button data-rate="1" class="on">1×</button>
    <button id="prev">◀ 上一格</button>
    <button id="next">下一格 ▶</button>
    <button data-num="beginner" class="on">初學者數值</button>
    <button data-num="detail">詳細數值</button>
    <span style="flex:1"></span>
    <span id="keys"></span>
  </div>
  <div id="timeline"><div class="release" id="releaseMark"></div><div class="cursor" id="cursor"></div></div>
  <div class="metrics" id="metrics"></div>
  <p class="note">
    單一正面鏡頭：手臂前後（深度）方向的數值是模型推估，精度低於左右、上下方向。袴遮住腳踝，足踏的開腳角度不可靠。
    手部（手の内、取懸け）因弽與弓遮擋未納入。紅線為依手腕速度偵測的離れ瞬間。
  </p>
</main>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const params = new URLSearchParams(location.search);
// ?clip=<name> picks a preset; ?video=&landmarks=&analysis= override individual files.
const CLIPS = {
  miyako: { dir: "../../../data/private/miyako/", video: "shaho_hassetsu.mp4", landmarks: "landmarks.json", analysis: "analysis.json" },
  "gen-v1": { dir: "../../../data/generated/v1/", video: "wan30.mp4", landmarks: "wan30_landmarks.json", analysis: "wan30_analysis.json" },
  "gen-yatsugae": { dir: "../../../data/generated/v5_yatsugae/", video: "yatsugae.mp4", landmarks: "landmarks.json", analysis: "analysis.json" },
  "gen-ashibumi": { dir: "../../../data/generated/v4_ashibumi_ff/b/", video: "ashibumi.mp4", landmarks: "landmarks.json", analysis: "analysis.json" },
};
const clip = CLIPS[params.get("clip")] || CLIPS.miyako;
const paths = {
  video: params.get("video") || clip.dir + clip.video,
  landmarks: params.get("landmarks") || clip.dir + clip.landmarks,
  analysis: params.get("analysis") || clip.dir + clip.analysis,
};

const [lm, an] = await Promise.all([fetch(paths.landmarks).then(r => r.json()), fetch(paths.analysis).then(r => r.json())]);
document.getElementById("source").textContent = an.source;

// ---- data ---------------------------------------------------------------
const frames = lm.frames;
const times = frames.map(f => f.t);

// Moving-average smoothing (±2 samples) to remove detector jitter.
function smoothed(key, i) {
  const acc = [];
  let n = 0;
  for (let k = Math.max(0, i - 2); k <= Math.min(frames.length - 1, i + 2); k++) {
    const pts = frames[k][key];
    if (!pts) continue;
    pts.forEach((p, j) => { acc[j] = acc[j] || [0, 0, 0]; acc[j][0] += p[0]; acc[j][1] += p[1]; acc[j][2] += p[2]; });
    n++;
  }
  if (!n) return null;
  const pts = acc.map(p => p.map(v => v / n));
  // World points get the camera-pitch correction computed by analyze.py.
  return key === "world" ? pts.map(rotate) : pts;
}
const R = an.up_rotation;
const rotate = p => R.map(row => row[0] * p[0] + row[1] * p[1] + row[2] * p[2]);

function frameAt(t) {
  let lo = 0, hi = times.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; times[mid] < t ? lo = mid + 1 : hi = mid; }
  return lo > 0 && Math.abs(times[lo - 1] - t) < Math.abs(times[lo] - t) ? lo - 1 : lo;
}

// ---- metrics (same definitions as tools/pose/analyze.py) ----------------
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const norm = a => Math.hypot(...a);
const deg = r => r * 180 / Math.PI;
const angle = (a, b, c) => { const u = sub(a, b), v = sub(c, b); return deg(Math.acos(Math.min(1, Math.max(-1, (u[0]*v[0]+u[1]*v[1]+u[2]*v[2]) / (norm(u) * norm(v)))))); };
const elevation = (p, q) => { const d = sub(q, p); return deg(Math.atan2(-d[1], Math.hypot(d[0], d[2]))); };
const tilt = (p, q, aspect) => deg(Math.atan2(-(q[1] - p[1]), Math.abs((q[0] - p[0]) * aspect)));

const METRICS = [
  ["弓手肘角（左）", w => angle(w[11], w[13], w[15]), "°", "180° = 完全伸直"],
  ["妻手肘角（右）", w => angle(w[12], w[14], w[16]), "°", ""],
  ["左肩開角", w => angle(w[23], w[11], w[13]), "°", "軀幹與上臂夾角"],
  ["右肩開角", w => angle(w[24], w[12], w[14]), "°", ""],
  ["左拳仰角", w => elevation(w[11], w[15]), "°", "肩→腕，相對水平"],
  ["右拳仰角", w => elevation(w[12], w[16]), "°", ""],
  ["左右腕高低差", w => (w[16][1] - w[15][1]) * 100, " cm", "+ = 弓手較高"],
  ["肩線傾斜", (w, p) => tilt(p[12], p[11], lm.width / lm.height), "°", "+ = 左肩較高"],
  ["腰線傾斜", (w, p) => tilt(p[24], p[23], lm.width / lm.height), "°", "+ = 左腰較高"],
  ["兩腳寬度", w => Math.hypot(w[27][0] - w[28][0], w[27][2] - w[28][2]) / Math.hypot(w[11][0] - w[12][0], w[11][2] - w[12][2]), " 肩寬", "腳踝間距÷肩寬；袴會遮住腳踝"],
  ["腳尖夾角", w => footAngle(w), "°", "足踏み約 60°"],
];
// Angle between the two feet (heel → toe) on the floor plane.
function footAngle(w) {
  const l = [w[31][0] - w[29][0], w[31][2] - w[29][2]], r = [w[32][0] - w[30][0], w[32][2] - w[30][2]];
  return deg(Math.acos(Math.min(1, Math.max(-1, (l[0] * r[0] + l[1] * r[1]) / (Math.hypot(...l) * Math.hypot(...r))))));
}
const metricsEl = document.getElementById("metrics");
metricsEl.innerHTML = METRICS.map(([name, , , hint]) => `<div class="metric"><span>${name}</span><b>—</b><em></em><span>${hint}</span></div>`).join("");
const metricVals = [...metricsEl.querySelectorAll("b")];
const metricDescs = [...metricsEl.querySelectorAll("em")];
// 初學者: round to the nearest 5 and add a plain-language reading; 詳細: whole numbers.
let numberMode = "beginner";
function formatMetric(v, unit) {
  if (unit === " 肩寬") return numberMode === "beginner" ? `約 ${(Math.round(v * 2) / 2).toFixed(1)} 個肩寬` : `${v.toFixed(2)} 個肩寬`;
  if (unit === " cm") return numberMode === "beginner" ? `約 ${Math.round(v)} cm` : `${v.toFixed(1)} cm`;
  return numberMode === "beginner" ? `約 ${Math.round(v / 5) * 5}°` : `${Math.round(v)}°`;
}
function describeMetric(k, v) {
  if (k <= 1) return v >= 165 ? "幾乎伸直" : v >= 80 && v <= 100 ? "約直角" : v < 80 ? "彎曲較深" : "微彎";
  if (k <= 3) return v >= 80 && v <= 100 ? "手臂約水平" : v > 150 ? "手臂高舉" : v < 45 ? "手臂下垂" : "";
  if (k <= 5) return Math.abs(v) <= 5 ? "與肩同高" : v > 45 ? "高舉過頭" : v > 5 ? "高於肩" : "低於肩";
  if (k === 6) return Math.abs(v) <= 3 ? "左右同高" : v > 0 ? "弓手較高" : "妻手較高";
  if (k === 9) return v < 0.6 ? "雙腳併攏" : v < 1.2 ? "略為張開" : "足踏み寬度";
  if (k === 10) return v >= 50 && v <= 70 ? "約 60°（標準）" : v < 50 ? "偏窄" : "偏寬";
  return Math.abs(v) <= 3 ? "水平" : "傾斜";
}

// ---- video --------------------------------------------------------------
const video = document.getElementById("video");
video.src = paths.video;
video.load();

// ---- 3D -----------------------------------------------------------------
const canvas3d = document.getElementById("three");
const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true, alpha: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
// Far enough back to fit the 2.2 m bow above the archer's head.
camera.position.set(0, 0.45, 5.6);
const controls = new OrbitControls(camera, canvas3d);
controls.target.set(0, 0.25, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(1.5, 4, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2 });
scene.add(sun);
const FLOOR_Y = -1.0;
const grid = new THREE.GridHelper(4, 16, 0x9aa0aa, 0xc4c8cf); grid.position.y = FLOOR_Y; scene.add(grid);
const shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.ShadowMaterial({ opacity: 0.25 }));
shadowCatcher.rotation.x = -Math.PI / 2; shadowCatcher.position.y = FLOOR_Y + 0.001; shadowCatcher.receiveShadow = true;
scene.add(shadowCatcher);

// Target direction marker (archer faces camera, target is on her left = +x).
scene.add(new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, FLOOR_Y + 0.02, 0), 1.6, 0xd9a441, 0.12, 0.06));

// --- grid-lined mannequin ---
// Light-grey skin with blue lines: 4 lines around each segment, rings every GRID_STEP metres.
const GRID_STEP = 0.07;
const gridCanvas = Object.assign(document.createElement("canvas"), { width: 256, height: 256 });
{
  const g = gridCanvas.getContext("2d");
  g.fillStyle = "#e4e6ea"; g.fillRect(0, 0, 256, 256);
  g.fillStyle = "#2f45d6";
  for (let i = 0; i < 4; i++) g.fillRect(i * 64, 0, 5, 256);
  g.fillRect(0, 0, 256, 5);
}
function gridMaterial(lengthRepeat, around = 1) {
  const tex = new THREE.CanvasTexture(gridCanvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  tex.repeat.set(around, lengthRepeat);
  return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.75 });
}

// Lofted tube whose rings are recomputed every frame (torso, limbs).
// ringFn(s) → { c: centre, x: half-width vector, z: half-depth vector } for s in [0, 1].
function makeTube(rings, sides, around = 1) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array((rings + 1) * (sides + 1) * 3);
  const uv = new Float32Array((rings + 1) * (sides + 1) * 2);
  const idx = [];
  for (let r = 0; r <= rings; r++) for (let s = 0; s <= sides; s++) {
    const k = r * (sides + 1) + s;
    uv[k * 2] = s / sides; uv[k * 2 + 1] = r / rings;
    if (r < rings && s < sides) { const a = k, b = k + sides + 1; idx.push(a, b, a + 1, b, b + 1, a + 1); }
  }
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  geo.setIndex(idx);
  const mesh = new THREE.Mesh(geo, gridMaterial(1, around));
  mesh.castShadow = true;
  mesh.update = (ringFn, length) => {
    for (let r = 0; r <= rings; r++) {
      const { c, x, z } = ringFn(r / rings);
      for (let s = 0; s <= sides; s++) {
        const a = s / sides * Math.PI * 2, k = (r * (sides + 1) + s) * 3;
        pos[k] = c.x + x.x * Math.cos(a) + z.x * Math.sin(a);
        pos[k + 1] = c.y + x.y * Math.cos(a) + z.y * Math.sin(a);
        pos[k + 2] = c.z + x.z * Math.cos(a) + z.z * Math.sin(a);
      }
    }
    geo.attributes.position.needsUpdate = true;
    geo.computeVertexNormals();
    geo.computeBoundingSphere();
    mesh.material.map.repeat.y = Math.max(1, length / GRID_STEP);
  };
  scene.add(mesh);
  return mesh;
}

// Limb = tube between two joints with tapering radius and rounded ends.
const V = () => new THREE.Vector3();
function limbRing(a, b, r0, r1) {
  const axis = V().subVectors(b, a), len = axis.length();
  axis.normalize();
  const ref = Math.abs(axis.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
  const u = V().crossVectors(axis, ref).normalize(), w = V().crossVectors(axis, u).normalize();
  const cap = 0.18; // fraction of the tube used for each rounded end
  return [s => {
    const t = s < cap ? -r0 * Math.cos(s / cap * Math.PI / 2) : s > 1 - cap ? r1 * Math.cos((1 - s) / cap * Math.PI / 2) : 0;
    const along = s < cap ? 0 : s > 1 - cap ? 1 : (s - cap) / (1 - 2 * cap);
    const base = s < cap ? r0 * Math.sin(s / cap * Math.PI / 2) : s > 1 - cap ? r1 * Math.sin((1 - s) / cap * Math.PI / 2) : r0 + (r1 - r0) * along;
    const c = V().copy(a).addScaledVector(V().subVectors(b, a), along).addScaledVector(axis, t);
    return { c, x: u.clone().multiplyScalar(base), z: w.clone().multiplyScalar(base) };
  }, len];
}

// [from, to, radius at from, radius at to]
const LIMBS = [
  [11, 13, 0.05, 0.042], [13, 15, 0.04, 0.032], [12, 14, 0.05, 0.042], [14, 16, 0.04, 0.032],
  [23, 25, 0.08, 0.06], [25, 27, 0.055, 0.04], [24, 26, 0.08, 0.06], [26, 28, 0.055, 0.04],
  [29, 31, 0.035, 0.03], [30, 32, 0.035, 0.03],
];
const limbMeshes = LIMBS.map(() => makeTube(10, 16));
const torso = makeTube(20, 32, 2);
// Spheres that fill the gaps where limb tubes meet.
const JOINT_BALLS = [[11, 0.056], [12, 0.056], [13, 0.046], [14, 0.046], [15, 0.036], [16, 0.036],
                     [23, 0.078], [24, 0.078], [25, 0.062], [26, 0.062], [27, 0.046], [28, 0.046]];
const ballMat = new THREE.MeshStandardMaterial({ color: 0x9fb0d8, roughness: 0.45, metalness: 0.05 });
const neckBall = new THREE.Mesh(new THREE.SphereGeometry(0.05, 20, 14), ballMat);
neckBall.castShadow = true; scene.add(neckBall);
const jointBalls = JOINT_BALLS.map(([, r]) => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), ballMat);
  m.castShadow = true; scene.add(m); return m;
});
const neck = makeTube(8, 12);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.1, 24, 16), gridMaterial(3));
head.scale.set(0.95, 1.2, 1.05); head.castShadow = true; scene.add(head);
const handMeshes = [15, 16].map(() => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.045, 16, 12), gridMaterial(1));
  m.scale.set(1, 1.4, 0.6); m.castShadow = true; scene.add(m); return m;
});

const up = new THREE.Vector3(0, 1, 0);
// MediaPipe world: +x image-right, +y down, +z away from camera → three.js: flip y and z.
const toV3 = p => new THREE.Vector3(p[0], -p[1], -p[2]);

function draw3D(w, t) {
  if (!w) return;
  // Drop the figure so the lower of the two heels rests on the floor.
  const floor = Math.min(-w[29][1], -w[30][1]);
  const shift = new THREE.Vector3(0, FLOOR_Y - floor + 0.03, 0);
  const P = w.map(p => toV3(p).add(shift));
  drawBow(P, t);


  LIMBS.forEach(([a, b, r0, r1], i) => limbMeshes[i].update(...limbRing(P[a], P[b], r0, r1)));
  JOINT_BALLS.forEach(([j], i) => jointBalls[i].position.copy(P[j]));

  // Torso: loft from hip line up to shoulder line, narrowing at the waist.
  const hipC = V().addVectors(P[23], P[24]).multiplyScalar(0.5), shC = V().addVectors(P[11], P[12]).multiplyScalar(0.5);
  const hipX = V().subVectors(P[23], P[24]).multiplyScalar(0.5), shX = V().subVectors(P[11], P[12]).multiplyScalar(0.5);
  const spine = V().subVectors(shC, hipC);
  const fwd = V().crossVectors(V().addVectors(hipX, shX), spine).normalize();
  torso.update(s => {
    const c = V().copy(hipC).addScaledVector(spine, -0.12 + s * 1.17);
    // Waist narrows between pelvis and chest; both ends close with a rounded cap.
    let width = 1.25 - 0.3 * Math.sin(Math.min(1, s / 0.75) * Math.PI);
    let depth = 0.1 + 0.025 * Math.sin(s * Math.PI);
    const bottomCap = s < 0.12 ? Math.sin(s / 0.12 * Math.PI / 2) : 1;
    const topCap = s > 0.86 ? 0.45 + 0.55 * Math.cos((s - 0.86) / 0.14 * Math.PI / 2) : 1;
    width *= Math.max(0.35, bottomCap) * topCap;
    depth *= bottomCap * (s > 0.86 ? topCap : 1);
    const x = V().lerpVectors(hipX, shX, s).multiplyScalar(width);
    return { c, x, z: fwd.clone().multiplyScalar(depth) };
  }, spine.length());

  // Head: centred between the ears, neck from shoulder midpoint.
  const headC = V().addVectors(P[7], P[8]).multiplyScalar(0.5);
  const headUp = V().subVectors(headC, shC).normalize();
  head.position.copy(headC).addScaledVector(headUp, 0.03);
  const earAxis = V().subVectors(P[7], P[8]).normalize();
  const faceDir = V().subVectors(P[0], headC).normalize();
  head.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(earAxis, headUp, V().crossVectors(earAxis, headUp).multiplyScalar(Math.sign(faceDir.dot(V().crossVectors(earAxis, headUp))) || 1)));
  neck.update(...limbRing(shC, V().copy(headC).addScaledVector(headUp, -0.06), 0.045, 0.04));
  neckBall.position.copy(shC).addScaledVector(headUp, 0.02);

  // Hands: oriented from wrist toward the index/pinky knuckles.
  [[15, 17, 19], [16, 18, 20]].forEach(([wr, pk, ix], i) => {
    const tip = V().addVectors(P[pk], P[ix]).multiplyScalar(0.5);
    const dir = V().subVectors(tip, P[wr]).normalize();
    handMeshes[i].position.copy(P[wr]).addScaledVector(dir, 0.05);
    handMeshes[i].quaternion.setFromUnitVectors(up, dir);
  });
}

// --- bow (yumi) and arrow -----------------------------------------------
// Dimensions in metres: 並寸 yumi 2.21 m with the grip ~1/3 from the bottom; arrow ≈ 矢束 + margin.
const BOW_UPPER = 1.47, BOW_LOWER = 0.74, BRACE = 0.15, ARROW_LEN = 0.95;
const bowMat = new THREE.MeshStandardMaterial({ color: 0xc89a52, roughness: 0.55 });
const gripMat = new THREE.MeshStandardMaterial({ color: 0x5a3a22, roughness: 0.8 });
const stringMat = new THREE.MeshStandardMaterial({ color: 0x3a3226, roughness: 0.9 });
const shaftMat = new THREE.MeshStandardMaterial({ color: 0x8a8f96, metalness: 0.4, roughness: 0.4 });
const featherMat = new THREE.MeshStandardMaterial({ color: 0xf2f2ee, side: THREE.DoubleSide, roughness: 0.9 });
const bowMesh = new THREE.Mesh(new THREE.BufferGeometry(), bowMat); bowMesh.castShadow = true; scene.add(bowMesh);
const gripMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.017, 0.017, 0.13, 12), gripMat); scene.add(gripMesh);
const stringMesh = new THREE.Mesh(new THREE.BufferGeometry(), stringMat); scene.add(stringMesh);
const arrow3d = new THREE.Group(); scene.add(arrow3d);
{
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.0045, 0.0045, ARROW_LEN, 8), shaftMat);
  shaft.position.y = ARROW_LEN / 2; arrow3d.add(shaft);
  const head = new THREE.Mesh(new THREE.ConeGeometry(0.007, 0.03, 8), shaftMat);
  head.position.y = ARROW_LEN + 0.015; arrow3d.add(head);
  for (let i = 0; i < 3; i++) {
    const vane = new THREE.Mesh(new THREE.PlaneGeometry(0.018, 0.13), featherMat);
    vane.position.set(0, 0.11, 0); vane.rotation.y = i * Math.PI * 2 / 3;
    vane.geometry.translate(0.011, 0, 0);
    arrow3d.add(vane);
  }
}
const bowParts = [bowMesh, gripMesh, stringMesh, arrow3d];

// Which state the bow and arrow are in at time t.
//   carry:    arrows held in the right hand (before 矢番え)
//   rest:     arrow nocked, right hand off the string (矢番え done, 胴造り)
//   drawn:    right hand on the string, from 弓構え (取懸け) until 離れ
//   released: after 離れ (弓返り done)
const DRAW_FROM = ["yugamae", "uchiokoshi", "daisan", "hikiwake", "kai"];
function bowState(t) {
  if (an.release_t != null && t >= an.release_t) return "released";
  const draw = an.segments.find(s => DRAW_FROM.includes(s.id));
  if (draw && t >= draw.start) return "drawn";
  const dozukuri = an.segments.find(s => s.id === "dozukuri");
  if ((an.nock_t != null && t >= an.nock_t) || (dozukuri && t >= dozukuri.start)) return "rest";
  return "carry";
}

function tube(points, radius) {
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 48, radius, 8, false);
}

function drawBow(P, t) {
  const state = bowState(t);
  const grip = V().addVectors(P[15], P[17]).add(P[19]).multiplyScalar(1 / 3);   // left hand centre
  const nock = V().addVectors(P[16], P[22]).multiplyScalar(0.5);                 // right thumb / 取懸け
  const target = new THREE.Vector3(1, 0, 0);
  const pull = V().subVectors(grip, nock);                                       // nock → grip
  const nocked = state === "drawn";
  // Arrow direction while nocked; otherwise the bow's back faces the target.
  const fwd = nocked && pull.length() > 0.12 ? pull.clone().normalize() : target.clone();
  const up = V().copy(new THREE.Vector3(0, 1, 0)).addScaledVector(fwd, -fwd.y).normalize();
  // Draw amount 0..1 from how far the string is pulled behind the grip.
  const draw = nocked ? THREE.MathUtils.clamp((pull.length() - BRACE) / 0.7, 0, 1) : 0;
  // Tips sit behind the grip (string side); after 弓返り the string has swung to the target side.
  const side = state === "released" ? 1 : -1;
  const bend = (BRACE + 0.22 * draw) * side;
  const shrink = 1 - 0.06 * draw;
  const at = (along, back) => V().copy(grip).addScaledVector(up, along * shrink).addScaledVector(fwd, back);
  const upperTip = at(BOW_UPPER, bend), lowerTip = at(-BOW_LOWER, bend * 0.85);
  bowMesh.geometry.dispose();
  bowMesh.geometry = tube([lowerTip, at(-BOW_LOWER * 0.5, bend * 0.3), grip, at(BOW_UPPER * 0.5, bend * 0.3), upperTip], 0.011);
  gripMesh.position.copy(grip);
  gripMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up);

  // String: straight between the tips, or bent at the nock while drawn.
  const nockOnString = nocked && pull.length() > BRACE ? nock : null;
  const path = new THREE.CurvePath();
  if (nockOnString) {
    path.add(new THREE.LineCurve3(upperTip, nock));
    path.add(new THREE.LineCurve3(nock, lowerTip));
  } else {
    path.add(new THREE.LineCurve3(upperTip, lowerTip));
  }
  stringMesh.geometry.dispose();
  stringMesh.geometry = new THREE.TubeGeometry(path, 16, 0.0025, 6, false);

  // Arrow
  arrow3d.visible = state !== "released";
  if (state === "rest") {
    // Nocked on the string just above the grip, pointing at the target; string straight.
    arrow3d.position.copy(grip).addScaledVector(fwd, -BRACE).addScaledVector(up, 0.03);
    arrow3d.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), fwd);
  }
  if (state === "carry") {
    // Held in the right fist, pointing at the bow's lower tip (執弓の姿勢の二等邊三角形).
    arrow3d.position.copy(nock);
    arrow3d.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), V().subVectors(lowerTip, nock).normalize());
  } else if (nocked) {
    arrow3d.position.copy(nockOnString || nock);
    arrow3d.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), fwd);
  }
}

function resize3D() {
  const r = canvas3d.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}
new ResizeObserver(resize3D).observe(canvas3d);

// ---- timeline -----------------------------------------------------------
const PHASE_COLORS = ["#8a8a8a","#c9b37e","#d9a441","#e3b85c","#9fc27a","#7fbf9f","#6fb0c8","#7f95d6","#e0614f","#b98ad6","#8a8a8a"];
const timeline = document.getElementById("timeline");
const duration = times[times.length - 1];
an.segments.forEach((s, i) => {
  const el = document.createElement("div");
  el.className = "seg";
  el.style.left = (s.start / duration * 100) + "%";
  el.style.width = ((s.end - s.start) / duration * 100) + "%";
  el.style.background = PHASE_COLORS[i % PHASE_COLORS.length];
  el.textContent = s.label;
  el.title = `${s.label}  ${s.start}–${s.end}s`;
  timeline.appendChild(el);
});
const releaseMark = document.getElementById("releaseMark");
if (an.release_t != null) releaseMark.style.left = (an.release_t / duration * 100) + "%";
else releaseMark.style.display = "none";
timeline.addEventListener("click", e => {
  const r = timeline.getBoundingClientRect();
  video.currentTime = (e.clientX - r.left) / r.width * duration;
});

const keys = document.getElementById("keys");
an.segments.forEach(s => {
  const b = document.createElement("button");
  b.textContent = s.label;
  b.title = `關鍵影格 ${s.keyframe_t.toFixed(2)}s`;
  b.onclick = () => { video.pause(); video.currentTime = s.keyframe_t; };
  keys.appendChild(b);
});

const phaseEl = document.getElementById("phase");
const phaseAt = t => {
  if (an.release_t != null && Math.abs(t - an.release_t) < 0.25) return "離れ";
  const s = an.segments.find(s => t >= s.start && t < s.end);
  return s ? s.label : "—";
};

// ---- controls -----------------------------------------------------------
const playBtn = document.getElementById("play");
playBtn.onclick = () => video.paused ? video.play() : video.pause();
video.addEventListener("play", () => playBtn.textContent = "❚❚ 暫停");
video.addEventListener("pause", () => playBtn.textContent = "▶ 播放");
document.querySelectorAll("[data-rate]").forEach(b => b.onclick = () => {
  video.playbackRate = +b.dataset.rate;
  document.querySelectorAll("[data-rate]").forEach(x => x.classList.toggle("on", x === b));
});
document.querySelectorAll("[data-num]").forEach(b => b.onclick = () => {
  numberMode = b.dataset.num;
  document.querySelectorAll("[data-num]").forEach(x => x.classList.toggle("on", x === b));
});
const stepBy = d => { video.pause(); const i = frameAt(video.currentTime) + d; video.currentTime = times[Math.max(0, Math.min(times.length - 1, i))]; };
document.getElementById("prev").onclick = () => stepBy(-1);
document.getElementById("next").onclick = () => stepBy(1);
addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); playBtn.click(); }
  if (e.key === "ArrowLeft") stepBy(-1);
  if (e.key === "ArrowRight") stepBy(1);
});

// ---- loop ---------------------------------------------------------------
const cursor = document.getElementById("cursor");
function tick() {
  const t = video.currentTime;
  const i = frameAt(t);
  const p = smoothed("pose", i), w = smoothed("world", i);
  draw3D(w, t);
  if (w && p) METRICS.forEach(([, fn, unit], k) => {
    const v = fn(w, p);
    metricVals[k].textContent = formatMetric(v, unit);
    metricDescs[k].textContent = describeMetric(k, v);
  });
  phaseEl.textContent = phaseAt(t);
  cursor.style.left = (t / duration * 100) + "%";
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
video.addEventListener("loadeddata", () => { video.currentTime = an.segments.find(s => s.id === "kai").keyframe_t; });
tick();
</script>
</body>
